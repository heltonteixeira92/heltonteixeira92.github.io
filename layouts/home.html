{{ define "main" }}
  <h1 class="manchete"><span class="c-codigo">Código</span> de dia.<br><span class="c-fora">Estrada</span> de noite.</h1>

  {{ with .Content }}
    <div class="abertura">{{ . }}</div>
  {{ end }}

  {{ partial "filtro.html" (dict "atual" "tudo") }}

  <ol class="lista">
    {{ range where site.RegularPages "Section" "posts" }}
      {{ partial "post-item.html" . }}
    {{ end }}
  </ol>
{{ end }}
