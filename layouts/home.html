{{ define "main" }}
  <h1 class="manchete">
    <a class="c-codigo" href="{{ "/categorias/codigo/" | relURL }}">~/codigo</a>
    <a class="c-fora" href="{{ "/categorias/fora/" | relURL }}">~/fora</a>
  </h1>

  {{ with .Content }}
    <div class="abertura">{{ . }}</div>
  {{ end }}

  {{ partial "filtro.html" (dict "atual" "tudo") }}

  <ol class="lista">
    {{ range where site.RegularPages "Section" "posts" }}
      {{ partial "post-item.html" . }}
    {{ end }}
  </ol>
{{ end }}
